name: Windows

on:
  push:
    paths: ['Windows/**', 'Resources/AppIcon.png', 'LICENSE', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', 'Resources/AppIcon.png', 'LICENSE', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional EXISTING release tag to attach Windows ZIPs to (e.g. v0.1.1); existing Windows assets are replaced. Blank = build artifacts only.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  desktop-checks:
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run hosted-hyperlink, UI layout and saved-PAT regression checks
        shell: pwsh
        run: |
          dotnet run --project LinkPeek.DesktopChecks/LinkPeek.DesktopChecks.csproj --configuration Release -- artifacts/ui-previews
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop regression checks failed.' }
      - name: TEMP dump previews
        if: always()
        shell: pwsh
        working-directory: Windows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./dump.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LinkPeek-UI-previews
          path: Windows/artifacts/ui-previews/
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and package portable app
        shell: pwsh
        run: ./publish.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: LinkPeek-Windows-${{ matrix.runtime }}
          path: |
            Windows/artifacts/LinkPeek-Windows-*-${{ matrix.runtime }}.zip
            Windows/artifacts/LinkPeek-Windows-*-${{ matrix.runtime }}.zip.sha256
          if-no-files-found: error

  # Publishes the verified Windows packages to the existing GitHub release v<Windows version>
  # after every successful push to main, and on a manual run for any existing tag. Never creates
  # tags or releases, never edits release notes, never touches macOS assets: only the four
  # LinkPeek-Windows-* files are added or replaced.
  attach-to-release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, desktop-checks]
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release-assets
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LinkPeek-Windows-win-*
          path: release-assets
          merge-multiple: true
      - name: Add or replace Windows packages on the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem release-assets -File | Where-Object { $_.Name -match '^LinkPeek-Windows-.*\.zip(\.sha256)?$' })
          if ($files.Count -ne 4) { throw 'Expected two Windows ZIPs and their two SHA-256 files.' }
          # Each .sha256 must describe the ZIP uploaded beside it.
          foreach ($zip in $files | Where-Object { $_.Name.EndsWith('.zip') }) {
            $expected = ((Get-Content "$($zip.FullName).sha256" -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash $zip.FullName -Algorithm SHA256).Hash -ne $expected) { throw "Checksum mismatch for $($zip.Name)." }
          }
          $tag = $env:RELEASE_TAG
          if ($env:EVENT -eq 'push') {
            $version = [regex]::Match($files[0].Name, '^LinkPeek-Windows-(\d+\.\d+\.\d+[^-]*)-win-').Groups[1].Value
            if (-not $version) { throw 'Cannot read the Windows version from the package name.' }
            $tag = "v$version"
          }
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag.StartsWith('-')) { throw 'Enter an existing release tag, such as v0.1.1.' }
          gh release view $tag --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            if ($env:EVENT -eq 'push') {
              Write-Output "::warning::Release $tag does not exist, so nothing was published. Create it in Releases to enable automatic Windows assets."
              exit 0
            }
            throw 'Release not found or not accessible. Create it in Releases first.'
          }
          # --clobber replaces only assets with these exact names.
          gh release upload $tag @($files.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. Check the release assets before retrying.' }
          Write-Output "Windows packages for $env:GITHUB_SHA published to $tag. macOS assets and release notes were preserved."
